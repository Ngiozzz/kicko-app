name: Deploy Supabase migrations

# Only runs when a migration file actually changes on main — pushing
# frontend/backend app code the rest of the time doesn't touch the
# database, so there's no reason to link/push on every commit. Manual
# workflow_dispatch is there for re-running by hand if a push is missed.
on:
  push:
    branches:
      - main
    paths:
      - "backend/supabase/migrations/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # The CLI looks for a ./supabase directory relative to where it runs —
    # this repo's lives at backend/supabase, not the repo root, so every
    # run: step below executes from there.
    defaults:
      run:
        working-directory: backend

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
      - run: supabase db push
